# Server
quarkus.http.port=9084

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.enable.auto.commit=true
kafka.auto.commit.interval.ms=1000
kafka.session.timeout.ms=30000

# Security - HTTP Basic Auth with in-memory users
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.user=userPass
quarkus.security.users.embedded.users.admin=adminPass
quarkus.security.users.embedded.roles.user=user
quarkus.security.users.embedded.roles.admin=admin,user

# Require auth on all paths except OpenAPI/Swagger
quarkus.http.auth.permission.authenticated.paths=/kafka/client/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/swagger-ui/*,/q/openapi
quarkus.http.auth.permission.public.policy=permit

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui.html
quarkus.smallrye-openapi.path=/v3/api-docs
