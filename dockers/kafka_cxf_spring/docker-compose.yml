version: "3"
networks:
  app-tier:
    driver: bridge
services:
    kafka:
        image: 'apache/kafka:4.3.0'
        networks:
            app-tier:
              aliases:
                - kafka
        ports:
            - '9092:9092'
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
          KAFKA_LISTENERS: 'EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9092,INTERNAL://kafka:9094'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
          KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    service_spring:
        image: 'gdimitriu/kafka_app:1.0-SNAPSHOT'
        networks:
            - app-tier
        ports:
            - '9080:9080'
        restart: on-failure 
        environment:
          - exposeRestPort=9080
          - kafkaPort=kafka:9094
          - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
        depends_on:
          - kafka
    service_cxf:
        image: 'gdimitriu/kafka_cxf:1.0-SNAPSHOT'
        networks:
          - app-tier
        ports:
          - '9180:9180'
          - '9182:9182'
        restart: on-failure
        environment:
          - exposeRestPort=9180
          - exposeWSPort=9182
          - kafkaPort=kafka:9094
          - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
        depends_on:
          - kafka

